version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatapp
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d chatapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chat_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chat_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Ho_Chi_Minh
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: admin
      DB_NAME: chatapp
      DB_SSL_MODE: disable
      DB_MAX_IDLE_CONNECTIONS: 5
      DB_MAX_CONNECTIONS: 10
      DB_MAX_LIFETIME: 10
      DB_MAX_IDLE_TIME: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: JWT_SECRET
      JWT_REFRESH_SECRET: JWT_REFRESH_SECRET
      UPLOAD_DIR: /app/uploads
      RATE_LIMIT_BY_IP: 5
      RATE_LIMIT_BY_TOKEN: 6
      AWS_SES_SENDER_EMAIL: AWS_SES_SENDER_EMAIL
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chat_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
      NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
