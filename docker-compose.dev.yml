version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatapp
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d chatapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: chat_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    image: cosmtrek/air:latest   # Hot reload cho Go
    container_name: chat_backend_dev
    working_dir: /app
    volumes:
      - ./backend:/app           # Mount thẳng source code vào
      - go_cache:/root/go        # Cache Go modules (download 1 lần)
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_URL: postgres://admin:admin@postgres:5432/chatapp?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: 6bb01df2bd4e7bbbe33cde0c7d9c5a83076f78bc42787256709d5dc2805d15fc
      JWT_REFRESH_SECRET: e0f4cd0561a4b1b22ef14fbf250aa2c5397d6c4fb3cf21ce4f3e0578112bbb8e
      UPLOAD_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: air -c .air.toml

  frontend:
    image: node:20-alpine
    container_name: chat_frontend_dev
    working_dir: /app
    volumes:
      - ./frontend:/app          # Mount thẳng source code vào
      - node_modules:/app/node_modules  # Cache node_modules
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
      NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev"

volumes:
  postgres_data:
  redis_data:
  go_cache:
  node_modules:
